name: Daily research briefing (audio)

# Narrates the day's world-ranked research with ElevenLabs and commits the MP3
# plus its manifest. The commit triggers a Vercel redeploy, so /api/briefing and
# the player on the Research page pick it up automatically.
#
# COST: ElevenLabs bills per character. scripts/daily-briefing.mjs measures the
# script before synthesizing and drops papers from the end until it fits
# BRIEFING_MAX_CHARS, so one run can never exceed that many characters. The
# dry-run step below prints the exact billable count before anything is spent.
#
# The job is non-destructive: a failed collection or a failed synthesis exits
# non-zero and leaves yesterday's briefing in place.

on:
  schedule:
    - cron: "30 5 * * *"       # 05:30 UTC daily, before most people's morning
  workflow_dispatch:
    inputs:
      papers:
        description: "How many papers to narrate (1-12)"
        required: false
        default: "8"
      max_chars:
        description: "Hard character budget for the script"
        required: false
        default: "5000"

concurrency:
  group: daily-briefing
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Free: OpenAlex is keyless and the Scholar tier is read from the existing
      # snapshot. This is what makes rank=world serve in single-digit
      # milliseconds instead of 700-1200ms, and it also spares OpenAlex's daily
      # budget, which a live per-request path exhausts quickly.
      - name: Refresh the world-ranked snapshot
        run: node scripts/snapshot-world.mjs || echo "world snapshot failed - keeping the previous one"

      - name: Print the script and its billable character count
        env:
          BRIEFING_PAPERS: ${{ github.event.inputs.papers || '8' }}
          BRIEFING_MAX_CHARS: ${{ github.event.inputs.max_chars || '5000' }}
        run: node scripts/daily-briefing.mjs --dry-run

      - name: Narrate the briefing (ElevenLabs)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID }}
          BRIEFING_PAPERS: ${{ github.event.inputs.papers || '8' }}
          BRIEFING_MAX_CHARS: ${{ github.event.inputs.max_chars || '5000' }}
        run: node scripts/daily-briefing.mjs || echo "briefing failed - keeping yesterday's"

      - name: Verify the audio and the snapshot
        run: node --test test/briefing.test.js test/world-snapshot.test.js

      - name: Commit + push if the briefing changed
        run: |
          git config user.name "techscroll-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain briefing.json briefings world-snapshot.json)" ]; then
            git add briefing.json briefings world-snapshot.json
            git commit -m "chore(data): daily research briefing + world-ranked snapshot [skip ci]"
            git push
            echo "pushed - Vercel will redeploy with today's briefing"
          else
            echo "no briefing changes - nothing to deploy"
          fi
