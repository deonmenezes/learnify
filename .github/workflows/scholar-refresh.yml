name: Scholar refresh (weekly)

# Rebuilds scholar-snapshot.json - the Google Scholar tier behind
# /api/research?rank=world - by running the Apify actor once a week.
#
# WHY WEEKLY AND NOT HOURLY: the actor bills $0.0015 per paper, so a full
# 23-topic refresh costs about $0.69. Weekly fits an Apify free plan ($5/month)
# with room to spare, and citation counts simply do not move fast enough to
# justify paying for more. The keyless OpenAlex tier is still live per-request,
# so "newest" is never stale between runs.
#
# The job is non-destructive: scripts/snapshot-scholar.mjs exits non-zero and
# leaves the previous snapshot in place if the provider returns nothing.

on:
  schedule:
    - cron: "0 4 * * 1"        # Mondays 04:00 UTC
  workflow_dispatch:
    inputs:
      budget_usd:
        description: "Hard USD ceiling for this run (Apify aborts at the cap)"
        required: false
        default: "1.00"
      topics:
        description: "Comma-separated topic labels, or empty for all 23"
        required: false
        default: ""

concurrency:
  group: scholar-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Show the cost plan before spending anything
        env:
          SCHOLAR_BUDGET_USD: ${{ github.event.inputs.budget_usd || '1.00' }}
          SCHOLAR_TOPICS: ${{ github.event.inputs.topics || '' }}
        run: node scripts/snapshot-scholar.mjs --dry-run

      - name: Refresh the Google Scholar snapshot (Apify)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SCHOLAR_BUDGET_USD: ${{ github.event.inputs.budget_usd || '1.00' }}
          SCHOLAR_TOPICS: ${{ github.event.inputs.topics || '' }}
        run: node scripts/snapshot-scholar.mjs || echo "scholar refresh failed - keeping the previous snapshot"

      - name: Verify the snapshot still satisfies the paper contract
        run: node --test test/scholar.test.js

      - name: Commit + push if the snapshot changed
        run: |
          git config user.name "techscroll-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain scholar-snapshot.json)" ]; then
            git add scholar-snapshot.json
            git commit -m "chore(data): weekly Google Scholar refresh via Apify [skip ci]"
            git push
            echo "pushed - Vercel will redeploy with the fresh Scholar tier"
          else
            echo "no snapshot changes - nothing to deploy"
          fi
